<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ShipGuard - Dashboard</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- Navigation -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">

        <a class="navbar-brand fw-bold" href="index.html">
            🚢 ShipGuard
        </a>

        <div class="navbar-nav ms-auto">
            <a class="nav-link active" href="index.html">Dashboard</a>
            <a class="nav-link" href="ships.html">Ships</a>
            <a class="nav-link" href="add-ship.html">Add Ship</a>
            <a class="nav-link" href="alerts.html">Alerts</a>
        </div>

    </div>
</nav>

<!-- Main -->
<div class="container mt-4">

    <div class="dashboard-header">
        <h1>Smart Ship Monitoring Dashboard</h1>
        <p>
            Monitor ship identity, location, speed and risk status.
        </p>
    </div>

    <!-- Statistics -->
    <div class="row g-4 mt-2">

        <div class="col-md-3">
            <div class="stat-card">
                <h6>Total Ships</h6>
                <h2 id="totalShips">0</h2>
            </div>
        </div>

        <div class="col-md-3">
            <div class="stat-card">
                <h6>Low Risk</h6>
                <h2 id="lowRisk">0</h2>
            </div>
        </div>

        <div class="col-md-3">
            <div class="stat-card">
                <h6>High Risk</h6>
                <h2 id="highRisk">0</h2>
            </div>
        </div>

        <div class="col-md-3">
            <div class="stat-card critical-card">
                <h6>Critical</h6>
                <h2 id="criticalRisk">0</h2>
            </div>
        </div>

    </div>

    <!-- Ships -->
    <div class="card mt-5 shadow">

        <div class="card-header bg-dark text-white">
            <h5 class="mb-0">Recently Monitored Ships</h5>
        </div>

        <div class="card-body">

            <div class="table-responsive">

                <table class="table table-hover">

                    <thead>
                    <tr>
                        <th>ID</th>
                        <th>Ship Name</th>
                        <th>IMO Number</th>
                        <th>Type</th>
                        <th>Speed</th>
                        <th>Status</th>
                        <th>Risk</th>
                    </tr>
                    </thead>

                    <tbody id="shipTable">
                    </tbody>

                </table>

            </div>

        </div>

    </div>

</div>

<script src="app.js"></script>

</body>
</html>
