<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ShipGuard - Add Ship</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link rel="stylesheet" href="style.css">

</head>

<body>

<nav class="navbar navbar-dark bg-dark">

    <div class="container-fluid">

        <a class="navbar-brand fw-bold" href="index.html">
            🚢 ShipGuard
        </a>

        <div class="navbar-nav flex-row">

            <a class="nav-link mx-2" href="index.html">
                Dashboard
            </a>

            <a class="nav-link mx-2" href="ships.html">
                Ships
            </a>

            <a class="nav-link mx-2 active" href="add-ship.html">
                Add Ship
            </a>

            <a class="nav-link mx-2" href="alerts.html">
                Alerts
            </a>

        </div>

    </div>

</nav>

<div class="container mt-5">

    <div class="form-container">

        <h2 class="mb-4">
            🚢 Register New Ship
        </h2>

        <form id="shipForm">

            <div class="row">

                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        Ship Name
                    </label>

                    <input
                        type="text"
                        id="shipName"
                        class="form-control"
                        placeholder="Enter ship name"
                        required>

                </div>

                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        IMO Number
                    </label>

                    <input
                        type="text"
                        id="imoNumber"
                        class="form-control"
                        placeholder="Example: IMO7654321"
                        required>

                </div>

                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        Flag Country
                    </label>

                    <input
                        type="text"
                        id="flagCountry"
                        class="form-control"
                        placeholder="Enter flag country"
                        required>

                </div>

                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        Ship Type
                    </label>

                    <select id="shipType" class="form-select" required>

                        <option value="">Select Type</option>

                        <option value="Cargo">
                            Cargo
                        </option>

                        <option value="Tanker">
                            Tanker
                        </option>

                        <option value="Container">
                            Container
                        </option>

                        <option value="Passenger">
                            Passenger
                        </option>

                        <option value="Fishing">
                            Fishing
                        </option>

                    </select>

                </div>

                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        Latitude
                    </label>

                    <input
                        type="number"
                        step="any"
                        id="latitude"
                        class="form-control"
                        placeholder="Example: 12.9716"
                        required>

                </div>

                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        Longitude
                    </label>

                    <input
                        type="number"
                        step="any"
                        id="longitude"
                        class="form-control"
                        placeholder="Example: 77.5946"
                        required>

                </div>

                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        Speed (knots)
                    </label>

                    <input
                        type="number"
                        step="any"
                        id="speed"
                        class="form-control"
                        placeholder="Example: 25"
                        required>

                </div>

                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        Status
                    </label>

                    <select id="status" class="form-select" required>

                        <option value="Normal">
                            Normal
                        </option>

                        <option value="Suspicious">
                            Suspicious
                        </option>

                    </select>

                </div>

            </div>

            <button
                type="submit"
                class="btn btn-primary mt-3">

                Register Ship

            </button>

            <a
                href="ships.html"
                class="btn btn-secondary mt-3">

                Cancel

            </a>

        </form>

        <div id="message" class="mt-4"></div>

    </div>

</div>

<script src="app.js"></script>

</body>
</html>
